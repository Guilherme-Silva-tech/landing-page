    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "KendryIA",
        "description": "Sistema de etiquetas para restaurantes com reconhecimento de voz e IA. Fale o pedido e imprima direto na sua etiquetadora por Bluetooth.",
        "brand": { "@type": "Brand", "name": "KendryIA" },
        "url": "https://kendryia-landing.vercel.app/",
        "image": "https://kendryia-landing.vercel.app/logo.jpg",
        "offers": {
          "@type": "Offer",
          "priceCurrency": "BRL",
          "price": "97",
          "description": "Plano mensal individual para restaurantes",
          "availability": "https://schema.org/InStock"
        }
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Preciso de equipamento especial para usar?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Não. A KendryIA funciona em navegador (Android e PC) e pelo app Bluefy no iPhone. Suporta as etiquetadoras térmicas via Bluetooth."
            }
          },
          {
            "@type": "Question",
            "name": "A IA entende o que eu falo ou digito?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sim. Fale ou digite o pedido do jeito que quiser e a IA gera as etiquetas prontas, padronizadas e com todos os campos certos — sem digitar campo por campo."
            }
          },
          {
            "@type": "Question",
            "name": "A etiqueta atende às regras de rotulagem?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sim. O sistema gera produto, tipo de conservação, código SIF quando informado e validade calculada automaticamente, no padrão exigido pelos órgãos de vigilância sanitária."
            }
          },
          {
            "@type": "Question",
            "name": "A impressora de etiquetas está inclusa?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sim. A impressora térmica de etiquetas já está inclusa no valor do plano — você não paga nada separado por ela."
            }
          },
          {
            "@type": "Question",
            "name": "Quantas etiquetas tenho por mês?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Depende do plano escolhido: 1.000, 2.000 ou 3.000 impressões por mês. Se a cota acabar, cada rolo avulso de 1.000 etiquetas custa R$ 80."
            }
          },
          {
            "@type": "Question",
            "name": "Quais as formas de pagamento?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Cartão de crédito com cobrança recorrente mensal ou Pix."
            }
          },
          {
            "@type": "Question",
            "name": "Posso testar antes de contratar?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sim! Fale com nossa equipe para agendar uma demonstração ao vivo com o seu cenário."
            }
          }
        ]
      }
    </script>

    <title>KendryIA — Etiquetas inteligentes para restaurantes</title>
