<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Página não encontrada — KendryIA</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: #0F0F14;
        color: #F1F1F4;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .wrap { text-align: center; max-width: 480px; }
      .code { font-size: 5rem; font-weight: 800; color: #8B5CF6; line-height: 1; }
      h1 { font-size: 1.4rem; margin: 18px 0 10px; }
      p { color: #9CA3AF; margin-bottom: 28px; }
      a {
        display: inline-block;
        background: linear-gradient(135deg, #6C3CE1, #8B5CF6);
        color: #fff;
        font-weight: 700;
        text-decoration: none;
        padding: 14px 32px;
        border-radius: 9999px;
      }
      a:hover { opacity: 0.92; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="code">404</div>
      <h1>Página não encontrada</h1>
      <p>O endereço que você acessou não existe ou foi movido.</p>
      <a href="/">Voltar para a KendryIA</a>
    </div>
  </body>
</html>
